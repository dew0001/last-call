[package]
name = "last_call_client"
description = "LAST CALL Bevy client. Rendering, input, prediction, UI, voice bridge, host-worker launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "client"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "last-call-client"
path = "src/main.rs"

[features]
default = []
# Build the WebGPU variant. Bevy's `webgpu` feature overrides `webgl2`, so the
# web build ships two bundles and `web/index.html` picks one at load time.
webgpu = ["bevy/webgpu"]

[dependencies]
shared.workspace = true
bevy = { workspace = true, features = [
    "std",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_log",
    "keyboard",
    "mouse",
    "bevy_state",
] }
lightyear.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["x11", "multi_threaded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgl2"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window"] }
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook.workspace = true
