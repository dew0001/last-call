[package]
name = "last_call_host"
description = "LAST CALL authoritative host simulation. Runs in a Web Worker (wasm) or natively (tests, bots)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "host"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "host-native"
path = "src/main.rs"

[dependencies]
shared.workspace = true
bevy = { workspace = true, features = ["std", "bevy_state", "bevy_log"] }
lightyear.workspace = true
avian3d.workspace = true
vleue_navigator.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# The soak's per-tick thread CPU clock (preemption on a shared VM is not tick cost).
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "WorkerGlobalScope", "Performance", "console"] }
