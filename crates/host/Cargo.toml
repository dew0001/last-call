[package]
name = "last_call_host"
description = "LAST CALL authoritative host simulation. Runs in a Web Worker (wasm) or natively (tests, bots)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "host"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "host-native"
path = "src/main.rs"

[dependencies]
shared.workspace = true
bevy = { workspace = true, features = ["std", "bevy_state"] }
lightyear.workspace = true
avian3d.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "WorkerGlobalScope", "Performance"] }
