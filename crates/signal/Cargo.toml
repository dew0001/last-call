[package]
name = "last_call_signal"
description = "LAST CALL signaling Worker: room code registry, SDP/ICE relay, TURN credentials, /health, /report."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "js"] }
shared = { version = "0.1.0", path = "../shared", package = "last_call_shared", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
