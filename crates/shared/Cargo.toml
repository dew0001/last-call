[package]
name = "last_call_shared"
description = "LAST CALL game rules, protocol, RNG wrappers and economy math. No render code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "shared"

[features]
default = ["net"]
# The lightyear protocol and shared simulation code. The signaling Worker turns
# this off so it only gets the plain-Rust parts (room codes).
net = ["dep:bevy", "dep:lightyear", "dep:crossbeam-channel", "dep:bytes", "dep:aeronet_io"]

[dependencies]
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
bevy = { workspace = true, optional = true, features = ["std", "bevy_state"] }
lightyear = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
aeronet_io = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
