# Signaling Worker (crates/signal). Free plan: SQLite-backed Durable Objects.
name = "last-call-signal"
main = "crates/signal/build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "./scripts/build-signal.sh"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[dev]
port = 8787
